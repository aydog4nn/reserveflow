- name: Jenkins sunucusunu hazırla
  hosts: lab
  become: true
  gather_facts: true

  tasks:

    - name: Ubuntu üzerinde çalışıldığını doğrula
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: Bu kurulum Ubuntu için hazırlanmıştır.

    - name: Java ve gerekli paketleri kur
      ansible.builtin.apt:
        name:
          - ca-certificates
          - fontconfig
          - openjdk-21-jdk
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: APT anahtar klasörünü oluştur
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Jenkins paket imzalama anahtarını indir
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Jenkins LTS paket deposunu tanımla
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: |
          deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/
        mode: "0644"
      register: jenkins_repository

    - name: Jenkins paketini kur
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: "{{ jenkins_repository.changed }}"

    - name: Jenkins servisini başlat
      ansible.builtin.systemd_service:
        name: jenkins
        enabled: true
        state: started

    - name: Jenkins portunun açılmasını bekle
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 180

    - name: Jenkins kullanıcısına Docker erişimi ver
      ansible.builtin.user:
        name: jenkins
        groups:
          - docker
        append: true
      notify: Jenkins servisini yeniden başlat

    - name: Ansible ortamı için gerekli paketleri kur
      ansible.builtin.apt:
        name:
          - python3-venv
          - openssh-client
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Jenkins için ayrı Ansible ortamı oluştur
      become: true
      become_user: jenkins
      ansible.builtin.pip:
        name:
          - ansible-core
          - ansible-lint
        virtualenv: /var/lib/jenkins/ansible-venv
        virtualenv_command: /usr/bin/python3 -m venv

  handlers:
    - name: Jenkins servisini yeniden başlat
      ansible.builtin.systemd_service:
        name: jenkins
        state: restarted
