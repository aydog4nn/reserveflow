services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD:?CI_DB_PASSWORD gerekli}
    volumes:
      - ci_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  db-setup:
    image: postgres:17
    entrypoint: [ "/bin/sh", "/provision/provision.sh" ]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${CI_DB_PASSWORD:?CI_DB_PASSWORD gerekli}
      INVENTORY_DB_PASSWORD: ${CI_INVENTORY_DB_PASSWORD:?CI_INVENTORY_DB_PASSWORD gerekli}
      ORDER_DB_PASSWORD: ${CI_ORDER_DB_PASSWORD:?CI_ORDER_DB_PASSWORD gerekli}
      PAYMENT_DB_PASSWORD: ${CI_PAYMENT_DB_PASSWORD:?CI_PAYMENT_DB_PASSWORD gerekli}
    volumes:
      - ./infra/postgres:/provision:ro
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.2.9-management
    environment:
      RABBITMQ_DEFAULT_USER: ci_app
      RABBITMQ_DEFAULT_PASS: ${CI_RABBITMQ_PASSWORD:?CI_RABBITMQ_PASSWORD gerekli}
      RABBITMQ_DEFAULT_VHOST: reserveflow
    volumes:
      - ci_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  inventory:
    image: reserveflow-inventory:${CI_IMAGE_TAG:?CI_IMAGE_TAG gerekli}
    pull_policy: never
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_app
      DB_PASSWORD: ${CI_INVENTORY_DB_PASSWORD:?CI_INVENTORY_DB_PASSWORD gerekli}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ci_app
      RABBITMQ_PASSWORD: ${CI_RABBITMQ_PASSWORD:?CI_RABBITMQ_PASSWORD gerekli}
    ports:
      - "127.0.0.1::8080"
    depends_on:
      db-setup:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  payment:
    image: reserveflow-payment:${CI_IMAGE_TAG:?CI_IMAGE_TAG gerekli}
    pull_policy: never
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment_app
      DB_PASSWORD: ${CI_PAYMENT_DB_PASSWORD:?CI_PAYMENT_DB_PASSWORD gerekli}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ci_app
      RABBITMQ_PASSWORD: ${CI_RABBITMQ_PASSWORD:?CI_RABBITMQ_PASSWORD gerekli}
      PAYMENT_SCHEDULING_ENABLED: "true"
    depends_on:
      db-setup:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  order:
    image: reserveflow-order:${CI_IMAGE_TAG:?CI_IMAGE_TAG gerekli}
    pull_policy: never
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: order_app
      DB_PASSWORD: ${CI_ORDER_DB_PASSWORD:?CI_ORDER_DB_PASSWORD gerekli}
      INVENTORY_BASE_URL: http://inventory:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ci_app
      RABBITMQ_PASSWORD: ${CI_RABBITMQ_PASSWORD:?CI_RABBITMQ_PASSWORD gerekli}
      MESSAGING_LAB_ENABLED: "false"
    ports:
      - "127.0.0.1::8081"
    depends_on:
      db-setup:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      inventory:
        condition: service_started
      payment:
        condition: service_started
volumes:
  ci_postgres_data:
  ci_rabbitmq_data: