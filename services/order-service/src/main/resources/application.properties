spring.application.name=order-service
order.client-id=${ORDER_CLIENT_ID:local-lab}
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
clients.inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8080}
clients.inventory.connect-timeout=${INVENTORY_CONNECT_TIMEOUT:2s}
clients.inventory.read-timeout=${INVENTORY_READ_TIMEOUT:3s}
