name: inventory-service

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Yonetici DB_PASSWORD gerekli}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  db-setup:
    image: postgres:17
    entrypoint: ["/bin/sh", "/provision/provision.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?Yonetici DB_PASSWORD gerekli}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Inventory parolasi gerekli}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Order parolasi gerekli}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Payment parolasi gerekli}
    volumes:
      - ./infra/postgres:/provision:ro
    depends_on:
      postgres:
        condition: service_healthy

  inventory:
    build:
      context: ./services/inventory-service
    image: reserveflow-inventory:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_app
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Inventory parolasi gerekli}
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully


  order:
    build:
      context: ./services/order-service
    image: reserveflow-order:local
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: order_app
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Order parolasi gerekli}
    depends_on:
      db-setup:
        condition: service_completed_successfully

  payment:
    build:
      context: ./services/payment-service
    image: reserveflow-payment:local
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment_app
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Payment parolasi gerekli}
    depends_on:
      db-setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
